<style>
/* Concept: دفتر حسابات من عمود واحد ضيق. الأرقام كبيرة وجدولية، سطر الصافي بخط مزدوج تحته،
   وأي لون أو مقاس محتاج انتباه بيظهر بشارة مكتوبة (مش لون بس). جدول اللون × المقاس هو قلب الشاشة. */
:root {
  --bg: #FBF6EC;
  --surface: #FFFFFF;
  --ink: #3A2F22;
  --muted: #7F6F55;
  --line: #E8DCC4;
  --accent: #8C6E32;
  --accent-ink: #FFFFFF;
  --soft: #F4EAD6;
  --good: #11763F;
  --good-bg: #E1F3E9;
  --bad: #B3261E;
  --bad-bg: #FBE6E4;
  --bad-line: #F0BDB8;
  --warn: #8A5A00;
  --warn-bg: #FBEFD3;
  --warn-line: #E8D29B;
  --cborder: #D9C9A5;
  color-scheme: light;
  --font-display: 'Readex Pro', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; line-height: 1.3; }
h2 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
bdi { unicode-bidi: isolate; }
.sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.meta { font-size: 13px; color: var(--muted); }
.amt, dd { font-variant-numeric: tabular-nums; }

button, input, select { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  padding: 10px 2px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap;
}
.tabs button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.periodbar { display: flex; align-items: center; gap: 10px; }
.periodbar label { font-size: 13px; color: var(--muted); }
select, input[type="text"], input:not([type]), input[type="search"], input[type="date"] {
  min-height: 44px; padding: 8px 12px; font-size: 16px; width: 100%; min-width: 0;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.periodbar select { width: auto; min-width: 170px; }
input[type="color"] { width: 44px; height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; flex: none; }

.btn {
  min-height: 42px; padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.link { background: none; border-color: transparent; color: var(--accent); padding-inline: 0; min-height: 34px; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel > h2 + * { margin-top: 12px; }
.panel.focus { border-color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

.lines { margin: 0; display: grid; }
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line dt { color: var(--muted); }
.line dd { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.line.sm dd { font-size: 16px; }
.line.total { border-bottom: 0; border-top: 2px solid var(--ink); }
.line.total dd { text-decoration: underline double; text-underline-offset: 6px; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.hint { font-size: 13px; color: var(--muted); margin-top: 10px; }

.pill { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 22px; white-space: nowrap; }
.p-ok, .p-in { background: var(--good-bg); color: var(--good); }
.p-low { background: var(--warn-bg); color: var(--warn); }
.p-out { background: var(--bad-bg); color: var(--bad); }
.p-sold { background: var(--soft); color: var(--accent); }
.p-adj { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

.cdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--cborder); flex: none; vertical-align: -2px; }
.cdot.sm { width: 12px; height: 12px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.cimg { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); flex: none; vertical-align: middle; }
.cimg.sm { width: 24px; height: 24px; border-radius: 6px; }
.crow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.ctiles { display: flex; flex-wrap: wrap; gap: 8px; }
.ctile { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 12px; text-align: center; }
.ctile .cimg { width: 64px; height: 64px; border-radius: 8px; }
.ctile .cl { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.ctile .cq { color: var(--muted); }
.ctile.out { opacity: .55; }
.rrow { padding: 10px 0; }
.stiles { display: flex; flex-wrap: wrap; gap: 8px; }
.stile { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); cursor: pointer; text-align: center; }
.stile .sn { font-size: 17px; font-weight: 700; }
.stile .sq { font-size: 11px; color: var(--muted); }
.stile[aria-pressed="true"] { border-color: var(--accent); outline: 2px solid var(--accent); }
.ctile[aria-pressed="true"] { border-color: var(--accent); outline: 2px solid var(--accent); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }

.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item:last-child, .mrow:last-child, .arow:last-child { border-bottom: 0; }
.item[hidden] { display: none; }
.iname { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-align: right; cursor: pointer; color: var(--ink); }
.iname:hover { color: var(--accent); }
.badtxt { font-size: 12px; font-weight: 600; color: var(--bad); margin-top: 2px; }
.badtxt .w { color: var(--warn); }
.qty { text-align: left; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.3; }
.qty .unit { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--muted); }
.acts, .rowact { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.rowact { justify-content: flex-end; margin-top: 2px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mrow b { overflow-wrap: anywhere; }
.amt { font-family: var(--font-display); font-size: 17px; font-weight: 600; text-align: left; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }

.bars { display: grid; gap: 12px; }
.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.barhead { display: flex; justify-content: space-between; gap: 12px; }

.toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 4px 14px; font-size: 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.solid[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.add { border-style: dashed; color: var(--muted); background: none; }
.addrow { display: flex; gap: 8px; align-items: center; }
.addrow input[type="text"], .addrow input:not([type]) { flex: 1; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 600; color: var(--muted); white-space: nowrap; }
td.n, th.n { text-align: left; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
.vlabel { display: inline-flex; align-items: center; gap: 6px; }

.grid { display: grid; gap: 6px; align-items: center; }
.gwrap { overflow-x: auto; padding-bottom: 4px; }
.gh { text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); }
.gl { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0; }
.gt { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell {
  height: 44px; width: 100%; min-width: 0; font-family: var(--font-display); font-size: 16px; font-weight: 600;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.cell.c-out { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.cell.c-low { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.cell.c-none { color: var(--muted); font-weight: 400; }
.cell.sel { background: var(--soft); border: 2px solid var(--accent); color: var(--ink); }
.cell.c-out.sel { color: var(--bad); }
.cell.c-low.sel { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
.sw.o { background: var(--bad-bg); border-color: var(--bad-line); }
.sw.l { background: var(--warn-bg); border-color: var(--warn-line); }
.sw.s { background: var(--soft); border: 2px solid var(--accent); }

.tscroll { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; }
.rtbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: max-content; }
.rtbl th { background: var(--soft); text-align: right; font-weight: 600; white-space: nowrap; padding: 7px 10px; }
.rtbl td { padding: 6px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
.rtbl th.n, .rtbl td.n { text-align: left; font-variant-numeric: tabular-nums; }
.rtbl tfoot td { font-weight: 700; background: var(--soft); }
.summary3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.summary3 .k { font-size: 12px; color: var(--muted); }
.summary3 .v { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { border-radius: 10px; padding: 12px 14px; font-size: 14px; background: var(--warn-bg); color: var(--warn); }
.selbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.mbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }

.empty { color: var(--muted); text-align: center; padding: 20px 8px; }
.empty .btnrow { justify-content: center; margin-top: 14px; }
.notice { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }

.scrim {
  position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 28, .55);
  display: flex; align-items: flex-end; justify-content: center;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
  background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 640px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 16px; padding-bottom: 18px; }
}
form { display: flex; flex-direction: column; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .flabel { font-size: 13px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.total { font-family: var(--font-display); font-weight: 600; min-height: 1.6em; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
.mact { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg span { position: relative; display: block; }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg label { display: block; text-align: center; padding: 10px; font-weight: 600; cursor: pointer; }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -4px; }
.qin, .cin { width: 100%; min-width: 0; height: 40px; text-align: center; font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.qsum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 2px solid var(--ink); }
.qsum b { font-family: var(--font-display); font-size: 20px; font-weight: 600; }

.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; text-align: center;
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .3s ease; }
}
@media (max-width: 480px) { .tabs button { font-size: 12.5px; padding-inline: 0; } }
.invrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.invrow:last-child { border-bottom: 0; }
.invrow b { overflow-wrap: anywhere; }
.steps { grid-column: 1 / -1; display: flex; gap: 4px; margin: 8px 0 4px; }
.steps span { flex: 1; text-align: center; font-size: 12px; padding: 5px 2px; border-radius: 8px; background: var(--line); color: var(--muted, inherit); opacity: .7; min-width: 0; }
.steps span.done { background: var(--accent); color: var(--accent-ink); opacity: .55; }
.steps span.cur { background: var(--accent); color: var(--accent-ink); opacity: 1; font-weight: 700; }
.invno { font-family: var(--font-display); font-weight: 600; color: var(--accent); }
.ltot { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.lineitem { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--bg); min-width: 0; }
.lineitem select, .lineitem input { background: var(--surface); }

#sa-login{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#sa-login .box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:14px}
#sa-login h1{margin:0;font-family:var(--font-display);font-size:24px;text-align:center}
#sa-login p{margin:0;text-align:center;color:var(--muted);font-size:14px}
#sa-login label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
#sa-login input{direction:ltr;text-align:left;font-size:16px;padding:10px 12px;border:1px solid var(--cborder);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
#sa-err{color:var(--bad);font-size:14px;min-height:20px;text-align:center}
#sa-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
#sa-remind{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 12px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);border-radius:10px;font-size:14px}
#sa-bar .who{font-size:12px;color:var(--muted);direction:ltr}
</style>

<div id="app" dir="rtl" lang="ar">
  <header>
    <h1>دفتر المحل</h1>
    <p class="sub" id="sync">جاري تحميل بياناتك…</p>
  </header>

  <nav class="tabs" aria-label="أقسام البرنامج">
    <button type="button" data-tab="summary">الملخص</button>
    <button type="button" data-tab="invoices">الفواتير</button>
    <button type="button" data-tab="orders">الأوردرات</button>
    <button type="button" data-tab="customers">العملاء</button>
    <button type="button" data-tab="suppliers">الموردين</button>
    <button type="button" data-tab="accounts">الحسابات</button>
    <button type="button" data-tab="treasury">الخزنة</button>
    <button type="button" data-tab="stock">المخزون</button>
    <button type="button" data-tab="report">التقرير</button>
    <button type="button" data-tab="check">فحص الحسابات</button>
  </nav>

  <div class="periodbar" id="periodbar">
    <label for="period">الفترة</label>
    <select id="period">
      <option value="today">اليوم</option>
      <option value="month">الشهر ده</option>
      <option value="lastmonth">الشهر اللي فات</option>
      <option value="year">السنة دي</option>
      <option value="all">كل الفترة</option>
    </select>
  </div>

  <main id="view" class="stack"></main>

  <div class="foot" id="foot"></div>
</div>

<div class="scrim" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div>
</div>

        S: [[3, 4, 2], [2, 3, 2], [2, 2, 1]] }
    ];
    try {
      var tasks = [], sales = [];
      for (var s = 0; s < SAMPLE.length; s++) {
        (function (d) {
          var id = uid(), pc = 0, sc = 0;
          tasks.push(function () { return put('items', id, { name: d.n, cat: d.cat, sys: d.sys, colors: d.colors, sizes: d.sizes, cost: d.cost, price: d.price, min: d.min, sample: true, ts: Date.now() }); });
          d.colors.forEach(function (c, ci) {
            d.sizes.forEach(function (sz, si) {
              var p = d.P[ci][si], sl = d.S[ci][si];
              if (p > 0) { pc += p; tasks.push(function () { return put('moves', uid(), { itemId: id, color: c.name, size: sz, type: 'in', qty: p, price: d.cost, cost: d.cost, date: daysAgo(18), note: '', sample: true, ts: Date.now() }); }); }
              if (sl > 0) sales.push({ itemId: id, color: c.name, size: sz, qty: sl, price: d.price, cost: d.cost });
            });
          });
        })(SAMPLE[s]);
      }
      [['إيجار', 3500, 10, 'cash'], ['كهرباء ومياه', 640, 6, 'voda'], ['مرتبات', 4200, 3, 'cash']].forEach(function (e) {
        tasks.push(function () { return put('money', uid(), { kind: 'expense', amount: e[1], category: e[0], method: e[3], note: '', date: daysAgo(e[2]), sample: true, ts: Date.now() }); });
      });
      var sup1 = uid(), sup2 = uid();
      tasks.push(function () { return put('suppliers', sup1, { name: 'مصنع النور للملابس', phone: '', sno: 1, sample: true, ts: Date.now() }); });
      tasks.push(function () { return put('suppliers', sup2, { name: 'مطبعة الأمل', phone: '', sno: 2, sample: true, ts: Date.now() }); });
      tasks.push(function () { return put('money', uid(), { kind: 'expense', amount: 1800, category: 'تغليف وطباعة', method: 'credit', credit: true, supplierId: sup2, note: '', date: daysAgo(8), sample: true, ts: Date.now() }); });
      tasks.push(function () { return put('money', uid(), { kind: 'expense', amount: 5200, category: 'خياطة وتصنيع', method: 'credit', credit: true, supplierId: sup1, note: '', date: daysAgo(12), sample: true, ts: Date.now() }); });
      tasks.push(function () { return put('spay', uid(), { supplierId: sup1, amount: 2000, method: 'insta', date: daysAgo(4), note: 'دفعة', sample: true, ts: Date.now() }); });
      tasks.push(function () { return put('tmoves', uid(), { kind: 'in', method: 'cash', amount: 20000, note: 'رصيد افتتاحي', date: daysAgo(20), sample: true, ts: Date.now() }); });
      var custs = [{ name: 'أحمد سمير', phone: '01012345678' }, { name: 'منى علي', phone: '01123456789' }, { name: 'شركة النور', phone: '' }].map(function (c, i) {
        return Object.assign({}, c, { id: uid(), cno: i + 1, sample: true, ts: Date.now() });
      });
      custs.forEach(function (c) { tasks.push(function () { return put('customers', c.id, clean(c)); }); });
      var NI = 6, invs = [];
      for (var k = 0; k < NI; k++) {
        invs.push({ no: k + 1, id: uid(), lines: [], custId: custs[k % 3].id, cname: custs[k % 3].name, date: daysAgo([6, 5, 4, 3, 2, 1][k]), discount: 0, note: '', sample: true });

      var FR = [1, 1, 0.5, 0, 1, 0.3];
      invs.forEach(function (iv, ix) {
        if (!iv.lines.length) return;
        invoiceWrites(iv).forEach(function (w) { tasks.push(function () { return put(w[0], w[1], w[2]); }); });
        var tot = 0; iv.lines.forEach(function (l) { tot += l.qty * l.price; });
        var pa = r2(tot * FR[ix]);
        if (pa > 0) tasks.push(function () { return put('payments', iv.id + '_pay0', { invoiceId: iv.id, customerId: iv.custId, amount: pa, method: ['cash', 'voda', 'insta'][ix % 3], date: iv.date, note: 'مقدم', sample: true, ts: Date.now() }); });
      });
      await pool(tasks, 5);
      toast('اتحملت بيانات تجريبية');

    state.saving = false; render();

  function updateInvLive() {
    var d = state.invdraft; if (!d || !$('#v-sum')) return;
    syncInv();
    var gross = 0, cogs = 0;
    d.lines.forEach(function (l, k) {
      var q = optNum(l.qty), p = optNum(l.price), it = state.items[l.itemId];
      var ok = q > 0 && p >= 0, tEl = $('#l-tot-' + k), aEl = $('#l-av-' + k);
      if (tEl) tEl.innerHTML = ok ? '<bdi>' + fmt(r2(q * p)) + '</bdi> ج.م' : '—';

        if (!it || !l.color || !l.size) { aEl.textContent = ''; aEl.className = 'meta'; }
        else {
          var av = invAvail(it.id, l.color, l.size, d.id), over = q > av + 1e-9;

    var paidNow;
    if (!d.id) { paidNow = optNum(d.paid); if (isNaN(paidNow)) paidNow = 0; if (!String(d.cname).trim() && paidNow <= 0.004) paidNow = Math.max(0, net); paidNow += creditUseOf(d); }
    else { var od = state.invoices[d.id]; paidNow = od ? (od.pm ? invPaid(od) : Math.max(0, net)) : 0; }

  async function saveInvoice() {
    syncInv();
    var d = state.invdraft, id = d.id, old = id ? state.invoices[id] : null;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return err('اختار التاريخ.', 'v-date');
    var disc = optNum(d.discount);
    if (isNaN(disc) || disc < 0) return err('الخصم لازم يكون رقم.', 'v-disc');
    var lines = [], need = {}, gross = 0;
    for (var k = 0; k < d.lines.length; k++) {
      var l = d.lines[k], it = state.items[l.itemId];
      if ((!l.itemId || (!l.color && !l.size && !String(l.price).trim())) && !String(l.qty).trim()) continue;
      if (!it) return err('اختار الصنف في السطر ' + (k + 1) + '.', 'l-item-' + k);
      if (!l.color) return err('اختار اللون في السطر ' + (k + 1) + '.');
      if (!l.size) return err('اختار المقاس في السطر ' + (k + 1) + '.');
      var q = optNum(l.qty), p = optNum(l.price);
      if (!(q > 0)) return err('اكتب الكمية في السطر ' + (k + 1) + '.', 'l-qty-' + k);
      if (isNaN(p) || p < 0) return err('السعر لازم يكون رقم في السطر ' + (k + 1) + '.', 'l-price-' + k);
      var key = vkey(it.id, l.color, l.size), nd = need[key] || (need[key] = { it: it, c: l.color, s: l.size, q: 0 });
      nd.q += q;
      lines.push({ itemId: it.id, color: l.color, size: l.size, qty: q, price: p, cost: lineCost(d, l, it) });
      gross += q * p;
    }
    if (!lines.length) return err('ضيف صنف واحد على الأقل.');
    var keys = Object.keys(need);
    for (var j = 0; j < keys.length; j++) {
      var n = need[keys[j]], av = invAvail(n.it.id, n.c, n.s, id);
      if (n.q > av + 1e-9) return err('المتاح ' + fmt(av) + ' قطعة بس من ' + n.it.name + ' (' + vlabel(n.c, n.s) + ').');
    }
    if (disc > gross + 1e-9) return err('الخصم أكبر من إجمالي الأصناف.', 'v-disc');
    if (d.dm === 'store') { d.ship = ''; d.shipco = ''; } else if (d.dm === 'self') d.shipco = SELF;
    else if (d.dm === 'ship' && (!String(d.shipco || '').trim() || isSelf(d.shipco))) return err('اكتب اسم شركة الشحن.', 'v-shipco');
    var shipV = String(d.ship || '').trim() === '' ? 0 : optNum(d.ship);
    if (isNaN(shipV) || shipV < 0) return err('مبلغ الشحن لازم يكون رقم.', 'v-ship');
    var net = r2(gross - disc), paidNew = 0, creditNew = 0, cn0 = d.cname.trim();
    if (!id) {
      paidNew = optNum(d.paid);
      if (isNaN(paidNew) || paidNew < 0) return err('المقدم لازم يكون رقم.', 'v-paid');
      var cuX = findCust(cn0); creditNew = cuX ? optNum(d.credit) : 0;
      if (isNaN(creditNew) || creditNew < 0) return err('الرصيد المخصوم لازم يكون رقم.', 'v-credit');
      if (creditNew > 0.004 && creditNew > custCredit(cuX.id) + 0.004) return err('رصيد العميل (' + fmt(custCredit(cuX.id)) + ') أقل من المبلغ ده.', 'v-credit');
      if (paidNew + creditNew > net + 0.004) return err('المقدم مع الرصيد أكبر من صافي الفاتورة.', 'v-paid');
      if (!cn0 && paidNew <= 0.004) paidNew = net;
      else if (!cn0 && paidNew < net - 0.004) return err('الدفع الجزئي محتاج اسم العميل.', 'v-cname');
    } else if (old.pm) {
      var paidOld = invPaid(old);
      if (paidOld > net + 0.004) return err('المدفوع (' + fmt(paidOld) + ') أكبر من صافي الفاتورة بعد التعديل. احذف دفعة الأول.');
      if (!cn0 && paidOld < net - 0.004) return err('الفاتورة اللي فيها مطلوب تحصيل لازم يتكتب فيها اسم العميل.', 'v-cname');
    }
    if (old && old.ret) return err('الفاتورة دي عليها مرتجع، مينفعش تتعدّل.');
    if (old && isOrder(old) && ostOf(old) === 'delivered' && (r2(shipV) !== r2(old.ship || 0) || String(d.shipco || '').trim() !== String(old.shipco || '').trim())) return err('الأوردر ده اتسلّم، فمينفعش تغيّر الشحن أو الشركة. اعمل «تراجع عن التسليم» من تاب الأوردرات الأول.', 'v-ship');
    var cname = d.cname.trim(), phone = d.phone.trim(), cust = findCust(cname), custId = '', ops = [];
    if (cname) {
      if (cust) {
        custId = cust.id;
        if (phone && phone !== (cust.phone || '')) ops.push(function () { return put('customers', cust.id, Object.assign(clean(cust), { phone: phone })); });
      } else {
        custId = uid();
        var nc = { name: cname, phone: phone, cno: nextCno(), ts: Date.now() };
        ops.push(function () { return put('customers', custId, nc); });
      }
    }
    var iv = { id: id || uid(), no: old ? old.no : nextInvNo(), date: d.date, custId: custId, cname: cname, lines: lines, discount: disc, note: d.note.trim(), ship: r2(shipV), shipco: String(d.shipco || '').trim(), osn: old ? (old.osn || nextOsn()) : nextOsn(), sample: !!(old && old.sample), ordx: old, ts: old ? old.ts : Date.now() };
    var writes = invoiceWrites(iv), keep = {};
    writes.forEach(function (w) { keep[w[1]] = true; });
    var invDoc = writes.filter(function (w) { return w[0] === 'invoices'; })[0];
    var rest = writes.filter(function (w) { return w[0] !== 'invoices'; });
    if (!id && paidNew > 0) rest.push(['payments', iv.id + '_pay0', { invoiceId: iv.id, customerId: custId, amount: r2(paidNew), method: d.method || 'cash', date: d.date, note: 'مقدم', ts: Date.now() }]);
    if (!id && creditNew > 0.004) rest.push(['payments', iv.id + '_pay1', { invoiceId: iv.id, customerId: custId, amount: r2(creditNew), method: 'credit', fromCredit: true, date: d.date, note: 'من رصيد العميل', ts: Date.now() }]);
    if (old && !old.pm) rest.push(['payments', iv.id + '_pay0', { invoiceId: iv.id, customerId: custId, amount: net, method: 'cash', date: old.date, note: 'مدفوعة بالكامل', ts: Date.now() }]);
    state.saving = true; $('#f-save').disabled = true; $('#f-save').textContent = 'بيتحفظ…';
    try {
      var stale = arr(state.moves).filter(function (m) { return m.invoiceId === iv.id && !keep[m.id]; });
      await pool(ops.concat(rest.map(function (w) { return function () { return put(w[0], w[1], w[2]); }; }),
        stale.map(function (m) { return function () { return del('moves', m.id); }; })), 8);
      await put(invDoc[0], invDoc[1], invDoc[2]);
      closeModal(); render();
      toast(old ? 'اتحدّثت الفاتورة وكل قيودها.' : 'اتحفظت الفاتورة وسُجّلت في الإيرادات.');
    } catch (e) { fail(e); state.saving = false; var b = $('#f-save'); if (b) { b.disabled = false; b.textContent = 'حفظ الفاتورة'; } }
  }

  async function deleteInvoice(id) {

  function reportData() {
    var r = range(state.period), sm = stockMap(), io = {};

    if (SA.busy) return; SA.busy = true; toast('بجهّز النسخة الاحتياطية…');
    var out = { app: 'daftar-mahal', at: new Date().toISOString(), data: {} };
    Promise.all(COLS.map(function (c) {
      return SA.fs.collection(c).get().then(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); out.data[c] = m;
      });
    })).then(function () {
      return saDownload({ filename: 'daftar-backup-' + today() + '.json', data: new Blob([JSON.stringify(out)], { type: 'application/json' }) });
    }).then(function () { try { localStorage.setItem('daftar-last-backup', today()); } catch (e) {} saRemind(); toast('اتحفظت نسخة احتياطية'); })
      .catch(function (e) { toast('النسخة الاحتياطية فشلت: ' + ((e && e.code) || (e && e.message) || '')); })
      .then(function () { SA.busy = false; });
  }
  function saImport(file) {
    if (!file || SA.busy) return;
    file.text().then(function (txt) {
      var j = JSON.parse(txt), d = (j && j.data) || j, total = 0;
      COLS.forEach(function (c) { total += Object.keys((d && d[c]) || {}).length; });
      if (!total) { toast('الملف مفيهوش بيانات.'); return; }
      if (!window.confirm('هتستورد ' + total + ' سجل. أي سجل بنفس الرقم هيتبدّل. تكمل؟')) return;
      SA.busy = true; toast('بستورد البيانات… استنى');
      var chain = Promise.resolve(), done = 0;
      COLS.forEach(function (c) {
        var m = (d && d[c]) || {}, ids = Object.keys(m);
        for (var s = 0; s < ids.length;) {
          (function (from) {
            var b = SA.fs.batch(), n = 0, sz = 0;
            while (s < ids.length && n < 200 && sz < 1500000) {
              var o = Object.assign({}, m[ids[s]]); delete o.id;
              sz += JSON.stringify(o).length; n++;
              b.set(SA.fs.collection(c).doc(ids[s]), o); s++;
            }
            chain = chain.then(function () { return b.commit(); }).then(function () { done += n; toast('اتستورد ' + done + ' من ' + total); });
          })(s);
        }
      });
      return chain.then(function () { toast('خلص الاستيراد: ' + total + ' سجل'); });
    }).catch(function (e) { toast('الاستيراد فشل: ' + ((e && e.code) || (e && e.message) || '')); })
      .then(function () { SA.busy = false; saEl('sa-file').value = ''; });
  }
  function saRemind() {
    var el = saEl('sa-remind'); if (!el) return;
    var last = ''; try { last = localStorage.getItem('daftar-last-backup') || ''; } catch (e) {}
    el.hidden = (last === today());
  }
  function saBar(email) {
    if (saEl('sa-bar')) { saEl('sa-bar').querySelector('.who').textContent = email || ''; return; }
    var bar = document.createElement('div'); bar.id = 'sa-bar';
    bar.innerHTML = '<button type="button" class="btn sm" id="sa-bk">نسخة احتياطية</button>' +
      '<button type="button" class="btn sm ghost" id="sa-imp">استيراد</button>' +
      '<button type="button" class="btn sm ghost" id="sa-out">خروج</button><span class="who"></span>';
    saEl('sync').parentNode.appendChild(bar);
    var rm = document.createElement('div'); rm.id = 'sa-remind'; rm.hidden = true;
    rm.innerHTML = '<span>لسه مأخدتش نسخة احتياطية النهاردة.</span><button type="button" class="btn sm" id="sa-rbk">خدها دلوقتي</button>';
    saEl('sync').parentNode.appendChild(rm);
    saEl('sa-rbk').addEventListener('click', saBackup);
    saRemind();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) saRemind(); });
    bar.querySelector('.who').textContent = email || '';
    saEl('sa-bk').addEventListener('click', saBackup);
    saEl('sa-imp').addEventListener('click', function () { saEl('sa-file').click(); });
    saEl('sa-out').addEventListener('click', function () { SA.auth.signOut().then(function () { location.reload(); }); });
    saEl('sa-file').addEventListener('change', function (e) { saImport(e.target.files && e.target.files[0]); });
  }
  state.downloads = { save: saDownload };
  render();
  if (!window.firebase) {
    saLogin('مقدرتش أحمّل Firebase. اتأكد من النت وحدّث الصفحة.');
  } else {
    firebase.initializeApp(FBC);
    SA.auth = firebase.auth(); SA.fs = firebase.firestore();
    saEl('sa-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var em = saEl('sa-email').value.trim(), pw = saEl('sa-pass').value;
      saEl('sa-go').disabled = true; saEl('sa-err').textContent = 'بسجّل دخولك…';
      SA.auth.signInWithEmailAndPassword(em, pw).catch(function (e) { saLogin(saMsg(e)); });
    });
    SA.auth.onAuthStateChanged(function (u) {
      if (u) {
        SA.user = u; saEl('sa-login').hidden = true; saBar(u.email);
        if (!state.db) {
          state.db = SA.fs; state.mode = 'db';
          COLS.forEach(watch);
          state.timer = setTimeout(function () { state.slow = true; render(); }, 10000);
        }
      } else saLogin('');
    });
  }
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
</body></html>
